server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: React Router handles routing client-side, so any path
    # that doesn't match a real static file falls back to index.html
    # (mirrors the rewrite rule already used in vercel.json).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite fingerprints built assets (e.g. index-abc123.js), so they're safe
    # to cache aggressively; index.html itself must stay revalidated.
    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|ttf|otf|woff|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
